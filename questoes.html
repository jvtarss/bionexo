<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questões - Bionexo</title>
  <meta name="description" content="Banco de questões interativas de Engenharia de Bioprocessos e Biotecnologia, com resolução passo a passo e simulado cronometrado.">
  <link rel="icon" type="image/svg+xml" href="assets/img/id/bionexo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Red+Hat+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="sec-q">
  <div id="header"></div>

  <main class="container">
    <div class="page-head">
      <div class="crumbs"><a href="index.html">Início</a> <span class="material-icons mi-sm">chevron_right</span> Questões</div>
      <h1>Banco de <span class="grad-text">questões</span></h1>
      <p>Estude questão a questão com resolução passo a passo, ou ative o <b>modo simulado</b> para uma prova cronometrada, por disciplina e dificuldade, com nota ao final.</p>
      <div class="mode-switch" role="tablist">
        <button class="ms-btn active" data-mode="estudar"><span class="material-icons mi-sm">menu_book</span> Estudar</button>
        <button class="ms-btn" data-mode="simulado"><span class="material-icons mi-sm">timer</span> Simulado</button>
      </div>
    </div>

    <!-- MODO ESTUDAR -->
    <section id="modoEstudar">
      <div class="toolbar">
        <label class="search">
          <span class="material-icons">search</span>
          <input id="qSearch" type="search" placeholder="Buscar por tema, livro, palavra-chave..." aria-label="Buscar questões">
        </label>
        <select class="select" id="qDisc" aria-label="Filtrar por disciplina"><option value="">Todas as disciplinas</option></select>
        <select class="select" id="qDiff" aria-label="Filtrar por dificuldade">
          <option value="">Qualquer dificuldade</option>
          <option value="diff-facil">Fácil</option>
          <option value="diff-media">Média</option>
          <option value="diff-dificil">Difícil</option>
        </select>
        <span class="result-count" id="qCount"></span>
      </div>
      <div class="q-list" id="qList"></div>
    </section>

    <!-- MODO SIMULADO -->
    <section id="modoSimulado" class="hidden">
      <div class="sim-panel">

        <div id="simSetup">
          <div class="sim-setup">
            <div class="grid-opts">
              <div>
                <label for="simDisc">Disciplina</label>
                <select class="select" id="simDisc"><option value="">Todas as disciplinas</option></select>
              </div>
              <div>
                <label for="simDiff">Dificuldade</label>
                <select class="select" id="simDiff">
                  <option value="">Qualquer</option>
                  <option value="diff-facil">Fácil</option>
                  <option value="diff-media">Média</option>
                  <option value="diff-dificil">Difícil</option>
                </select>
              </div>
              <div>
                <label for="simQtd">Número de questões</label>
                <select class="select" id="simQtd">
                  <option value="5">5 questões</option>
                  <option value="10">10 questões</option>
                  <option value="15">15 questões</option>
                  <option value="999">Todas as disponíveis</option>
                </select>
              </div>
              <div>
                <label for="simTime">Tempo</label>
                <select class="select" id="simTime">
                  <option value="120">2 min por questão</option>
                  <option value="60">1 min por questão</option>
                  <option value="180">3 min por questão</option>
                  <option value="0">Sem limite de tempo</option>
                </select>
              </div>
            </div>
            <div class="sim-note" id="simAvail"></div>
            <button class="btn btn-grad" id="simStart" style="margin-top:18px;width:100%"><span class="material-icons mi-sm">play_arrow</span> Iniciar simulado</button>
          </div>

          <div class="history" id="simHistory">
            <h2><span class="material-icons">history</span> Tentativas anteriores</h2>
            <div class="hist-list" id="histList"></div>
            <button class="btn btn-ghost btn-sm" id="histClear" style="margin-top:14px"><span class="material-icons mi-sm">delete</span> Limpar histórico</button>
          </div>
        </div>

        <section id="simRunning" class="hidden">
          <div class="sim-bar">
            <span class="timer" id="simTimer"><span class="material-icons">timer</span> <span id="simClock">--:--</span></span>
            <span class="sim-progress" id="simProg"></span>
            <button class="btn btn-primary" id="simFinish"><span class="material-icons mi-sm">done_all</span> Finalizar</button>
          </div>
          <div class="q-list" id="simList"></div>
          <button class="btn btn-grad" id="simFinish2" style="width:100%;margin-top:8px"><span class="material-icons mi-sm">done_all</span> Finalizar simulado</button>
        </section>

        <section id="simResult" class="hidden"></section>

      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="data/questoes.js"></script>
  <script src="js/components.js"></script>
  <script src="js/questoes.js"></script>
  <script src="js/simulado.js"></script>
  <script>
    // Alterna entre "Estudar" e "Simulado" na mesma pagina
    (function () {
      const estudar = document.getElementById("modoEstudar");
      const simulado = document.getElementById("modoSimulado");
      const btns = document.querySelectorAll(".ms-btn");
      function set(mode) {
        const sim = mode === "simulado";
        simulado.classList.toggle("hidden", !sim);
        estudar.classList.toggle("hidden", sim);
        btns.forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
      }
      function apply() { set(location.hash === "#simulado" ? "simulado" : "estudar"); }
      btns.forEach(b => b.addEventListener("click", () => {
        if (b.dataset.mode === "simulado") location.hash = "simulado";
        else history.replaceState(null, "", location.pathname + location.search);
        set(b.dataset.mode);
      }));
      window.addEventListener("hashchange", apply);
      apply();
    })();
  </script>
</body>
</html>
