<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Resumos objetivos das disciplinas de Engenharia de Bioprocessos e Biotecnologia.">
  <link rel="icon" type="image/svg+xml" href="assets/img/id/bionexo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Red+Hat+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<body class="sec-r">
  <div id="header"></div>

  <main class="container">

      <div class="crumbs"><a href="index.html">Início</a> <span class="material-icons mi-sm">chevron_right</span> Resumos</div>

    <div class="toolbar">
      <label class="search">
        <span class="material-icons">search</span>
        <input id="rSearch" type="search" placeholder="Buscar resumo..." aria-label="Buscar resumos">

      <select class="select" id="rDisc" aria-label="Filtrar por disciplina"><option value="">Todas as disciplinas</option></select>
      <span class="result-count" id="rCount"></span>
    </div>

    <div class="gallery" id="rList"></div>

  <div class="reader" id="rReader" role="dialog" aria-modal="true" aria-label="Leitor de resumo"></div>

  <div id="footer"></div>

  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="data/resumos.js"></script>
